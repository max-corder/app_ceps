<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cepsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#cepsGrad)"/>
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#5eead4" stroke-width="8" opacity="0.4"/>
  
  <!-- Medical Plus Cross with shadow -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="216" y="116" width="80" height="280" rx="24" fill="url(#crossGrad)"/>
    <!-- Horizontal Bar -->
    <rect x="116" y="216" width="280" height="80" rx="24" fill="url(#crossGrad)"/>
  </g>
  
  <!-- Heartbeat / EKG pulse line across cross center -->
  <path d="M 140 256 L 200 256 L 225 210 L 256 300 L 285 235 L 305 256 L 372 256" 
        fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        
  <!-- Center Heart dot -->
  <circle cx="256" cy="256" r="8" fill="#14b8a6"/>
  
  <!-- CEPS Label Pill -->
  <rect x="176" y="420" width="160" height="42" rx="21" fill="#ffffff" opacity="0.95"/>
  <text x="256" y="449" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#0f766e" text-anchor="middle" letter-spacing="3">CEPS</text>
</svg>
